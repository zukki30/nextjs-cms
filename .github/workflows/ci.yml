name: CI

on:
  pull_request:
  push:
    branches: [main]

# 同じブランチへ連続 push したときは古い実行をキャンセルする
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: ${{ matrix.task }}
    runs-on: ubuntu-latest
    strategy:
      # 1つ落ちても残りのチェック結果を見たいので中断しない
      fail-fast: false
      matrix:
        task:
          - lint
          - typecheck
          - test
    steps:
      - uses: actions/checkout@v7

      # pnpm のバージョンは package.json の packageManager から解決される
      - uses: pnpm/action-setup@v6.1.0

      - uses: actions/setup-node@v7
        with:
          # バージョンは .mise.toml の [tools] node から読む（setup-node v7.1.0 以降が対応）。
          # ローカルの mise と CI の固定箇所を 1 つにまとめ、片方だけ古くなるのを防ぐ
          node-version-file: .mise.toml
          cache: pnpm
          # @zukki30/zukki-design-system は GitHub Packages の private パッケージ。
          # 読み取りには、パッケージ設定の Manage Actions access にこのリポジトリを
          # Read で追加しておく必要がある（implementation-plan.md 0.4）
          registry-url: https://npm.pkg.github.com
          scope: "@zukki30"

      - run: pnpm install --frozen-lockfile
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm ${{ matrix.task }}
